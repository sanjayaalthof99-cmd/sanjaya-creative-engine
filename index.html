<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sanjaya Creative AI Engine</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <header class="text-center max-w-2xl mx-auto mb-8">
    <h1 class="text-3xl font-extrabold text-indigo-400">Sanjaya Creative AI Engine</h1>
    <p class="text-sm text-slate-400 mt-2">Generator gambar & konversi foto ke prompt otomatis.</p>
  </header>

  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col justify-between">
      <div>
        <h2 class="text-xl font-bold text-indigo-300 mb-4 flex items-center space-x-2">
          <span>📷</span> <span>Image to Prompt (Otomatis)</span>
        </h2>

        <div id="dropZone" onclick="document.getElementById('fileInput').click()" 
             class="border-2 border-dashed border-slate-600 rounded-xl p-4 text-center hover:border-indigo-500 cursor-pointer transition bg-slate-900/50 flex flex-col items-center justify-center min-h-[180px]">
          <input type="file" id="fileInput" accept="image/*" class="hidden">
          
          <div id="uploadPlaceholder" class="flex flex-col items-center space-y-2">
            <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="text-sm text-slate-300 font-medium">Klik / Upload Foto di Sini</span>
          </div>

          <img id="imagePreview" src="" alt="Preview" class="hidden max-h-48 object-contain rounded-lg shadow-md">
        </div>

        <div id="statusBox" class="hidden mt-4 text-center">
          <span id="statusText" class="text-indigo-400 text-xs font-medium animate-pulse">Memproses foto...</span>
        </div>

        <div id="resultContainer" class="hidden mt-4">
          <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Hasil Prompt AI:</label>
          <div class="relative">
            <textarea id="promptOutput" rows="4" readonly class="w-full p-3 pr-24 rounded-lg bg-slate-900 border border-slate-700 text-white text-xs resize-none"></textarea>
            <button id="copyBtn" onclick="copyPrompt()" class="absolute right-2 top-2 bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-md text-xs font-medium transition">
              Salin Prompt
            </button>
          </div>
        </div>
      </div>
    </div>

    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col justify-between">
      <div>
        <h2 class="text-xl font-bold text-emerald-300 mb-4 flex items-center space-x-2">
          <span>🎨</span> <span>Text to Image Generator</span>
        </h2>

        <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Instruksi (Bisa Bahasa Indonesia):</label>
        <textarea id="promptInput" rows="3" placeholder="Contoh: Buatkan gambar pria indonesia sedang duduk..." class="w-full p-3 rounded-lg bg-slate-900 text-white border border-slate-700 focus:outline-none focus:border-emerald-500 mb-4 text-xs"></textarea>

        <button onclick="generateImage()" id="btnGenerate" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition duration-200">
          Generate Gambar
        </button>

        <div id="genResultBox" class="mt-4 hidden flex flex-col items-center">
          <img id="aiResult" src="" alt="Hasil AI" class="w-full max-h-64 object-cover rounded-xl shadow-lg mb-3 border border-slate-700">
          <button onclick="downloadImage()" class="w-full text-center bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-semibold transition">
            Download Gambar Ke Galeri
          </button>
        </div>
      </div>
    </div>

  </div>

  <script>
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    const promptOutput = document.getElementById('promptOutput');

    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    // Otomatis kompresi gambar agar ringan diproses Cloud AI
    function resizeImage(file, maxWidth = 500) {
      return new Promise((resolve) => {
        const reader = new FileReader();
        reader.onload = (e) => {
          const img = new Image();
          img.onload = () => {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            resolve(canvas.toDataURL('image/jpeg', 0.7));
          };
          img.src = e.target.result;
        };
        reader.readAsDataURL(file);
      });
    }

    async function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return alert('Harap masukkan file gambar.');

      imagePreview.src = URL.createObjectURL(file);
      imagePreview.classList.remove('hidden');
      uploadPlaceholder.classList.add('hidden');

      statusBox.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      statusText.innerText = 'Menganalisis gambar...';

      try {
        const base64Data = await resizeImage(file);
        
        const response = await fetch('https://text.pollinations.ai/', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            messages: [
              {
                role: "user",
                content: [
                  { type: "text", text: "Describe this image detailed in English as an AI image prompt. Return only the prompt string, highly detailed, photorealistic." },
                  { type: "image_url", image_url: { url: base64Data } }
                ]
              }
            ]
          })
        });

        if (!response.ok) throw new Error('Error Server');
        const result = await response.text();
        promptOutput.value = result.trim();
        resultContainer.classList.remove('hidden');
      } catch (err) {
        alert('Gagal memproses gambar. Pastikan koneksi internet lancar.');
      } finally {
        statusBox.classList.add('hidden');
      }
    }

    function copyPrompt() {
      navigator.clipboard.writeText(promptOutput.value);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = 'Tersalin!';
      setTimeout(() => copyBtn.innerText = 'Salin Prompt', 2000);
    }

    // Auto Translate Bahasa Indonesia -> Inggris
    async function translateToEnglish(text) {
      try {
        const res = await fetch(`https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&tl=en&dt=t&q=${encodeURIComponent(text)}`);
        const data = await res.json();
        return data[0][0][0];
      } catch (e) {
        return text;
      }
    }

    let currentGeneratedUrl = '';

    async function generateImage() {
      const rawPrompt = document.getElementById('promptInput').value.trim();
      if (!rawPrompt) return alert('Ketik instruksi terlebih dahulu!');

      const genResultBox = document.getElementById('genResultBox');
      const aiResult = document.getElementById('aiResult');
      const btn = document.getElementById('btnGenerate');

      btn.innerText = 'Menerjemahkan & Memproses...';
      btn.disabled = true;

      // Terjemahkan otomatis perintah ke Bahasa Inggris
      const englishPrompt = await translateToEnglish(rawPrompt);
      const encodedPrompt = encodeURIComponent(englishPrompt);
      const seed = Math.floor(Math.random() * 999999);
      currentGeneratedUrl = `https://image.pollinations.ai/prompt/${encodedPrompt}?width=1024&height=1024&seed=${seed}&nologo=true`;

      const loaderImg = new Image();
      loaderImg.src = currentGeneratedUrl;

      loaderImg.onload = () => {
        aiResult.src = currentGeneratedUrl;
        genResultBox.classList.remove('hidden');
        btn.innerText = 'Generate Gambar';
        btn.disabled = false;
      };

      loaderImg.onerror = () => {
        alert('Gagal memuat gambar.');
        btn.innerText = 'Generate Gambar';
        btn.disabled = false;
      };
    }

    // Fungsi Pengunduh Langsung Ke Galeri
    async function downloadImage() {
      if (!currentGeneratedUrl) return;
      try {
        const response = await fetch(currentGeneratedUrl);
        const blob = await response.blob();
        const url = window.URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `AI-Gambar-${Date.now()}.jpg`;
        document.body.appendChild(a);
        a.click();
        a.remove();
        window.URL.revokeObjectURL(url);
      } catch (e) {
        window.open(currentGeneratedUrl, '_blank');
      }
    }
  </script>
</body>
</html>
