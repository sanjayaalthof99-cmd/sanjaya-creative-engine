<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- Judul di Tab Browser -->
  <title>Sanjaya Creative AI Engine - Auto Prompt & Image Generator</title>
  
  <link rel="icon" type="image/png" href="favicon.png">
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen p-4 md:p-8">

  <!-- Header Website -->
  <header class="text-center max-w-2xl mx-auto mb-8">
    <h1 class="text-3xl font-extrabold text-indigo-400">Sanjaya Creative AI Engine</h1>
    <p class="text-sm text-slate-400 mt-2">Konversi foto ke prompt otomatis & buat gambar dari teks dalam satu tempat gratis.</p>
  </header>

  <!-- Container Dua Kolom -->
  <div class="max-w-6xl mx-auto grid grid-cols-1 md:grid-cols-2 gap-8">

    <!-- FITUR 1: IMAGE TO PROMPT -->
    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col justify-between">
      <div>
        <h2 class="text-xl font-bold text-indigo-300 mb-4 flex items-center space-x-2">
          <span>📷</span> <span>Image to Prompt (Otomatis)</span>
        </h2>

        <!-- Dropzone / Upload Box -->
        <div id="dropZone" 
             class="border-2 border-dashed border-slate-600 rounded-xl p-4 text-center hover:border-indigo-500 cursor-pointer transition bg-slate-900/50 flex flex-col items-center justify-center min-h-[180px]">
          <input type="file" id="fileInput" accept="image/*" class="hidden">
          
          <div id="uploadPlaceholder" class="flex flex-col items-center space-y-2">
            <svg class="w-10 h-10 text-slate-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/>
            </svg>
            <span class="text-sm text-slate-300 font-medium">Upload atau Drag Foto ke Sini</span>
            <span class="text-xs text-slate-500">Prompt diproses otomatis saat foto dipilih</span>
          </div>

          <img id="imagePreview" src="" alt="Preview" class="hidden max-h-48 object-contain rounded-lg shadow-md">
        </div>

        <!-- Status Loading AI -->
        <div id="statusBox" class="hidden mt-4 text-center">
          <div class="inline-flex items-center space-x-2 text-indigo-400 text-xs font-medium">
            <svg class="animate-spin h-4 w-4 text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <span id="statusText">Memuat AI...</span>
          </div>
        </div>

        <!-- Hasil Prompt -->
        <div id="resultContainer" class="hidden mt-4">
          <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Hasil Prompt AI:</label>
          <div class="relative">
            <textarea id="promptOutput" rows="4" readonly
                      class="w-full p-3 pr-24 rounded-lg bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none resize-none"></textarea>
            <button id="copyBtn" onclick="copyPrompt()"
                    class="absolute right-2 top-2 bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1.5 rounded-md text-xs font-medium transition">
              Salin Prompt
            </button>
          </div>
        </div>
      </div>
    </div>

    <!-- FITUR 2: TEXT TO IMAGE -->
    <div class="bg-slate-800 p-6 rounded-2xl shadow-xl border border-slate-700 flex flex-col justify-between">
      <div>
        <h2 class="text-xl font-bold text-emerald-300 mb-4 flex items-center space-x-2">
          <span>🎨</span> <span>Text to Image Generator</span>
        </h2>

        <label class="block text-xs font-semibold text-slate-400 mb-2 uppercase">Masukkan Prompt / Instruksi:</label>
        <textarea id="promptInput" rows="3" placeholder="Tempel prompt di sini atau ketik sesuatu..." 
                  class="w-full p-3 rounded-lg bg-slate-900 text-white border border-slate-700 focus:outline-none focus:border-emerald-500 mb-4 text-xs"></textarea>

        <button onclick="generateImage()" id="btnGenerate"
                class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-semibold py-2.5 rounded-lg text-sm transition duration-200">
          Generate Gambar
        </button>

        <!-- Hasil Gambar & Download -->
        <div id="genResultBox" class="mt-4 hidden flex flex-col items-center">
          <img id="aiResult" src="" alt="Hasil AI" class="w-full max-h-64 object-cover rounded-xl shadow-lg mb-3 border border-slate-700">
          <a id="downloadBtn" download="ai-generated.jpg" target="_blank" 
             class="w-full text-center bg-indigo-600 hover:bg-indigo-500 text-white py-2 rounded-lg text-xs font-semibold transition">
            Download Gambar
          </a>
        </div>
      </div>
    </div>

  </div>

  <!-- Script AI Engine -->
  <script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

    let captioner = null;

    const dropZone = document.getElementById('dropZone');
    const fileInput = document.getElementById('fileInput');
    const imagePreview = document.getElementById('imagePreview');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const statusBox = document.getElementById('statusBox');
    const statusText = document.getElementById('statusText');
    const resultContainer = document.getElementById('resultContainer');
    const promptOutput = document.getElementById('promptOutput');

    dropZone.addEventListener('click', () => fileInput.click());
    fileInput.addEventListener('change', (e) => handleFile(e.target.files[0]));

    dropZone.addEventListener('dragover', (e) => {
      e.preventDefault();
      dropZone.classList.add('border-indigo-500');
    });

    dropZone.addEventListener('dragleave', () => dropZone.classList.remove('border-indigo-500'));

    dropZone.addEventListener('drop', (e) => {
      e.preventDefault();
      dropZone.classList.remove('border-indigo-500');
      if (e.dataTransfer.files.length > 0) handleFile(e.dataTransfer.files[0]);
    });

    async function handleFile(file) {
      if (!file || !file.type.startsWith('image/')) return alert('Harap masukkan file gambar.');

      const imageUrl = URL.createObjectURL(file);
      imagePreview.src = imageUrl;
      imagePreview.classList.remove('hidden');
      uploadPlaceholder.classList.add('hidden');

      statusBox.classList.remove('hidden');
      resultContainer.classList.add('hidden');
      statusText.innerText = 'Memuat AI...';

      try {
        if (!captioner) {
          captioner = await pipeline('image-to-text', 'Xenova/vit-gpt2-image-captioning');
        }
        statusText.innerText = 'Membaca gambar & membuat prompt...';
        
        const result = await captioner(imageUrl);
        const baseCaption = result[0]?.generated_text || 'An image';
        const finalPrompt = `${baseCaption.trim()}, 8k resolution, highly detailed, photorealistic, cinematic lighting`;
        
        promptOutput.value = finalPrompt;
        resultContainer.classList.remove('hidden');
      } catch (err) {
        console.error(err);
        alert('Gagal memproses gambar. Coba muat ulang halaman.');
      } finally {
        statusBox.classList.add('hidden');
      }
    }

    window.copyPrompt = function() {
      navigator.clipboard.writeText(promptOutput.value);
      const copyBtn = document.getElementById('copyBtn');
      copyBtn.innerText = 'Tersalin!';
      copyBtn.classList.replace('bg-indigo-600', 'bg-emerald-600');
      setTimeout(() => {
        copyBtn.innerText = 'Salin Prompt';
        copyBtn.classList.replace('bg-emerald-600', 'bg-indigo-600');
      }, 2000);
    };

    window.generateImage = function() {
      const prompt = document.getElementById('promptInput').value;
      if (!prompt) return alert('Ketik atau tempel prompt terlebih dahulu!');

      const genResultBox = document.getElementById('genResultBox');
      const aiResult = document.getElementById('aiResult');
      const downloadBtn = document.getElementById('downloadBtn');
      const btn = document.getElementById('btnGenerate');

      btn.innerText = 'Memproses Gambar...';
      btn.disabled = true;

      const encodedPrompt = encodeURIComponent(prompt);
      const imageUrl = `https://pollinations.ai/p/${encodedPrompt}?width=1024&height=1024&seed=${Math.floor(Math.random() * 1000)}`;

      aiResult.onload = () => {
        btn.innerText = 'Generate Gambar';
        btn.disabled = false;
        genResultBox.classList.remove('hidden');
      };

      aiResult.src = imageUrl;
      downloadBtn.href = imageUrl;
    };
  </script>
</body>
</html>
